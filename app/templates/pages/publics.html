{% extends "partials/conteneur.html" %}

{% block titre %}Types de publics{% endblock %}

{% block body %}

<div class="container">
    <section class="page-header d-flex-between mt-4">
        <h1>Sommaire des publics</h1>
    </section>
    <hr/>

    <!-- Lien pour tous les publics -->
    <section>
        <a href="{{ url_for('public', type_public_choisi='ALL') }}">
            <h2>Tous les publics</h2>
        </a>
        <hr/>
    </section>

    <!-- Liens pour chaque type de public -->
    {% for public in liste_publics %}
    <section>
        <a href="{{ url_for('public', type_public_choisi=public['type_public']) }}">
            <h2>{{ public['type_public'] }}</h2>
        </a>
        <hr/>
    </section>
    {% endfor %}

</div>

{% endblock %}
